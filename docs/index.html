<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SHADOWS</title>
    <script type="module" crossorigin src="./assets/index-CKbwOlSC.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-A2ZEGBXl.css">
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="vignette"></div>

    <div id="hud" hidden>
      <div id="battery-wrap">
        <span>Linterna</span>
        <div id="battery"><div id="battery-fill"></div></div>
      </div>
    </div>

    <div id="prompt" class="hint" hidden></div>
    <div id="message" class="note" hidden></div>

    <div id="keypad" class="overlay" hidden>
      <div class="keypad-panel">
        <h2>Teclado</h2>
        <div id="keypad-display" class="keypad-display"></div>
        <div id="keypad-pad" class="keypad-pad"></div>
        <p id="keypad-feedback" class="inv-feedback"></p>
        <p class="help">Esc para cerrar</p>
      </div>
    </div>

    <div id="inventory" class="overlay" hidden>
      <div class="inv-panel">
        <h2>Inventario</h2>
        <div id="inv-grid" class="inv-grid"></div>
        <div class="inv-detail">
          <h3 id="inv-name"></h3>
          <p id="inv-desc"></p>
          <button id="inv-use" type="button" hidden>Usar</button>
          <p id="inv-feedback" class="inv-feedback"></p>
        </div>
        <p class="help">I o Esc para cerrar</p>
      </div>
    </div>

    <div id="start-screen" class="overlay">
      <h1>SHADOWS</h1>
      <p class="sub">03:17. Estás en el hospital.</p>
      <button id="start-btn" type="button">Empezar</button>
      <p class="help">
        WASD mover · Ratón mirar · Shift correr · Ctrl agacharse · F linterna · E interactuar · I inventario · Esc pausa
      </p>
    </div>

    <div id="pause-screen" class="overlay" hidden>
      <h2>Pausa</h2>
      <button id="resume-btn" type="button">Continuar</button>
    </div>

  </body>
</html>
